<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASTER AI SIGNAL</title>

<style>
body {
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}
.card {
  background: #151e30;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
}
h1 { color: #00d69b; }
select {
  padding: 10px;
  border-radius: 8px;
}
.status { color: orange; }
</style>
</head>

<body>

<h1>MASTER AI SIGNAL</h1>
<p>XAUUSD GOLD ANALYSIS</p>

<div class="card">
<h3>Market Price</h3>
<h2 id="price">Waiting for real data...</h2>
<p id="dataStatus" class="status">
DATA NOT CONNECTED
</p>
</div>

<div class="card">
<h3>Timeframe</h3>
<select id="timeframe">
<option>M5</option>
<option>M15</option>
<option>H1</option>
</select>
</div>

<div class="card">
<h3>AI SIGNAL</h3>
<h2 id="signal">WAIT</h2>
<p>Entry: --</p>
<p>Stop Loss: --</p>
<p>Take Profit: --</p>
</div>

<div class="card">
<h3>Robot Status</h3>
<p>Pair: XAUUSD</p>
<p>Mode: SIGNAL ONLY</p>
<p id="robotStatus">NOT STARTED</p>
</div>

<script>
async function updateGoldPrice() {
  const priceEl = document.getElementById("price");
  const statusEl = document.getElementById("dataStatus");

  try {
    const response = await fetch(
      "https://xaus.com/api/v1/spot?compact=1"
    );

    if (!response.ok) {
      throw new Error("API unavailable");
    }

    const data = await response.json();
    const price = data.spot_usd_oz;
    const state = data.data_state?.status;

    if (typeof price !== "number" || !Number.isFinite(price)) {
      throw new Error("Invalid price");
    }

    priceEl.textContent =
      "USD " + price.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

    if (state === "fresh") {
      statusEl.textContent = "LIVE INDICATIVE • FRESH";
    } else if (state === "stale") {
      statusEl.textContent = "STALE DATA • CHECK PRICE";
    } else {
      statusEl.textContent = "DATA UNAVAILABLE";
    }

  } catch (error) {
    statusEl.textContent = "CONNECTION ERROR";
  }
}

updateGoldPrice();
setInterval(updateGoldPrice, 60000);
<script>
async function updateGoldCandles() {
  const status = document.getElementById("dataStatus");

  let panel = document.getElementById("candleData");

  if (!panel) {
    panel = document.createElement("div");
    panel.id = "candleData";
    panel.style.cssText =
      "background:#151e30;padding:15px;margin-top:15px;border-radius:12px;color:white;line-height:1.8;";
    status.insertAdjacentElement("afterend", panel);
  }

  try {
    const response = await fetch(
      "https://xaus.com/api/v1/chart?symbol=xau&range=1d&interval=5m"
    );

    if (!response.ok) {
      throw new Error("API error");
    }

    const data = await response.json();
    const points = data.points;

    if (!Array.isArray(points) || points.length === 0) {
      throw new Error("No candle data");
    }

    const candle = points[points.length - 1];

    panel.innerHTML = `
      <h3>GOLD CANDLE M5</h3>
      <p>Open: ${candle.o}</p>
      <p>High: ${candle.h}</p>
      <p>Low: ${candle.l}</p>
      <p>Close: ${candle.c}</p>
      <p>Candle tersedia: ${points.length}</p>
      <p>Data: ${data.data_state?.status || "unknown"}</p>
    `;
  } catch (error) {
    panel.textContent = "CANDLE DATA CONNECTION ERROR";
  }
}

updateGoldCandles();
setInterval(updateGoldCandles, 300000);
<script>
</body>
</html>
